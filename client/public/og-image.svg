<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0c0e"/>
      <stop offset="100%" style="stop-color:#131316"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow circle -->
  <circle cx="600" cy="315" r="280" fill="rgba(99,102,241,0.07)"/>
  <circle cx="600" cy="315" r="180" fill="rgba(99,102,241,0.05)"/>

  <!-- Logo text -->
  <text x="600" y="290" font-family="Inter, Arial, sans-serif" font-size="160" font-weight="900"
        letter-spacing="-8" text-anchor="middle" fill="url(#accent)">miloo</text>

  <!-- Tagline -->
  <text x="600" y="360" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="600"
        letter-spacing="-0.5" text-anchor="middle" fill="rgba(255,255,255,0.7)">
    Meet Real Strangers Online
  </text>

  <!-- Sub tagline -->
  <text x="600" y="410" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400"
        letter-spacing="0" text-anchor="middle" fill="rgba(255,255,255,0.4)">
    Free Random Chat · No Signup · Match by Mood
  </text>

  <!-- Bottom pill -->
  <rect x="470" y="460" width="260" height="48" rx="24" fill="rgba(99,102,241,0.2)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
  <text x="600" y="491" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700"
        text-anchor="middle" fill="#818cf8">miloo.chat</text>
</svg>
